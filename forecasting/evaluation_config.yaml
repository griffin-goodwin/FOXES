# =============================================================================
# FOXES Evaluation Configuration
# =============================================================================
# Used by evaluation.py to compute metrics and generate plots.
#
# Usage: python forecasting/evaluation.py --config forecasting/evaluation_config.yaml
# =============================================================================

model_predictions:
  main_model_csv: "/Users/griffingoodwin/Documents/gitrepos/FOXES/forecasting/foxes_outputs/inference/predictions.csv"

evaluation:
  output_dir:  "./foxes_outputs/evaluation"
  # Auto-runs for Gaussian or quantile columns; point metrics use the median
  # for pinball models. Quantile scores use the checkpoint's normalized space.
  evaluate_uncertainty: true

plotting:
  regression_background: "black"
  # Match maps and the optional AIA image to prediction CSV timestamps.
  # Set inference_patch_dir to null to skip these figures.
  inference_patch_dir: "./foxes_outputs/inference_patch"
  aia_dir: "./foxes_data/AIA_processed/test"
  aia_wavelength: 193
  max_patch_maps: null  # null = all matching timestamps
  # Flux and uncertainty maps share a log color scale spanning the smallest
  # positive to largest value across all CSV-matched patch maps.
