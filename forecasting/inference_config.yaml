# =============================================================================
# FOXES Inference Configuration
# =============================================================================
# Used by inference.py to run a trained ViTLocal checkpoint over a folder of
# AIA data and write out SXR predictions (+ optional attention/flux maps).
#
# Usage:
#   python forecasting/inference.py --config forecasting/inference_config.yaml
# =============================================================================

wavelengths: [94, 131, 171, 193, 211, 304, 335]

# Set to "true" if you only have AIA images and no ground-truth SXR to compare
# against (e.g. running on new/live data). When true, data.sxr_dir is ignored.
prediction_only: "false"

# Optional reproducible random subset of eligible timestamps. Leave both null
# to run every sample. Set either count (e.g. 1000) or fraction (e.g. 0.1).
# Selected results are written in timestamp order.
sampling:
  count: 500
  fraction: null
  seed: 42

data:
  # Point these directly at the folder of .npy files you want to run the model
  # on — no special subfolder naming (e.g. "test/") is required or assumed.
  # Example paths below match the local output of the download/build configs.
  aia_dir:         "/Volumes/T9/FOXES_Data/AIA_processed/test"
  sxr_dir:         "/Volumes/T9/FOXES_Data/SXR_processed/test"   # ignored if prediction_only: "true"
  sxr_norm_path:   null  # optional check against the normalization stored in the checkpoint
  # Enable only for a checkpoint trained with this exact AIA transform/artifact.
  aia_norm_path:   null  # set to the matching AIA normalization artifact if used in training
  checkpoint_path: "/Users/griffingoodwin/Downloads/pinball.ckpt"  # select your trained checkpoint

# Detect deterministic, coupled Gaussian, or coupled pinball checkpoints.
# Explicit alternatives: deterministic, coupled_uncertainty, coupled_pinball.
model_type: auto

output_path: "./foxes_outputs/inference/predictions.csv"

# Per-sample attention weights (NPY per timestamp). Set model_params.no_weights: true to skip.
weight_path: "./foxes_outputs/inference_patch/weights/"

# Per-patch flux contribution maps (NPY per timestamp) — saved automatically
# during inference whenever flux_path is set and model_params.no_flux is false (default).
flux_path:   "./foxes_outputs/inference_patch/flux/"

# Pinball checkpoints also save each original head's contribution map here,
# under q0.05/, q0.16/, etc., using the trained probabilities. no_flux skips both.
# If omitted, defaults to flux_path's sibling quantile_flux/ directory.
quantile_flux_path: "./foxes_outputs/inference_patch/quantile_flux/"

# The Gaussian model saves one per-patch standard-deviation NPY. Global
# 68%/95% intervals always go in the predictions CSV.
# Pinball CSVs instead contain all raw/normalized quantile heads, their median,
# and a crossing flag. They have no Gaussian variance or patch uncertainty maps.
patch_uncertainty_path: "./foxes_outputs/inference_patch/patch_uncertainty/"

model_params:
  input_size: 512
  patch_size: 8
  batch_size: 1  # benchmarked at ~89 samples/s, ~26/24 GiB peak VRAM
  no_weights: true   # true = skip saving attention weights (saves ~3GB/batch of GPU memory)
  no_flux:    true   # true = skip saving flux contribution maps
  no_patch_uncertainty: true  # true = skip per-patch uncertainty map files

device: auto      # auto chooses CUDA, then Apple MPS, then CPU; or set cuda/mps/cpu
num_workers: 6   # 48 CPU cores and 685 GB of test NPY files: keep I/O prefetched
pin_memory:  false
prefetch_factor: 1
persistent_workers: true
multiprocessing_context: spawn
use_amp:     false
amp_dtype:   bfloat16  # Blackwell-native and safer numerically than FP16
matmul_precision: high # enables fast TF32 for operations outside autocast
progress_update_interval: 1024
multi_gpu:   false  # set true to use all available GPUs via DataParallel
