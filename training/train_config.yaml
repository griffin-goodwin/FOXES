# Independent local multipliers, global correction, and uncertainty.
# Toggle global_head.enabled and uncertainty.enabled; both default to true.
# Local/global heads use PyTorch default random initialization.
# mean_loss.huber_delta controls both independent mean objectives.
wavelengths:
- 94
- 131
- 171
- 193
- 211
- 304
- 335
gpu_ids: all
batch_size: 48
epochs: 50
seed: 1
accumulate_grad_batches: 1
model_type: uncertainty
uncertainty:
  enabled: true
  initial_relative_std: 1.0
  min_log10_relative_std: -6.0
  max_log10_relative_std: 6.0
  uncertainty_hidden_dim: 128
vit_architecture:
  embed_dim: 512
  num_channels: 7
  num_classes: 1
  patch_size: 8
  num_patches: 4096
  hidden_dim: 2048
  num_heads: 8
  num_layers: 12
  dropout: 0.1
  learning_rate: 5.0e-05
  mask_mode: local
  local_window: 3
local_head:
  max_abs_log10_multiplier: 8.0
global_head:
  enabled: true
  grid_size: 32
  attention_dim: 128
  num_heads: 4
  max_abs_adjustment: 1.5
  dropout: 0.0
  num_layers: 1
  hidden_dim: 128
  mlp_depth: 1
mean_loss:
  huber_delta: 0.3
  class_weighting: inverse_frequency
optimizer:
  weight_decay: 1.0e-07
  gradient_clip_val: null
  scheduler:
    T_max: 50
    eta_min: 1.0e-06
checkpoint:
  monitor: val/total_loss
  mode: min
  save_top_k: -1
  include_step_in_filename: false
  include_monitor_in_filename: true
early_stopping:
  enabled: false
  monitor: val_class/macro_mse_dex2
  mode: min
  patience: 5
  min_delta: 0.0
  check_finite: true
  verbose: true
logging:
  log_every_n_steps: 10
callbacks:
  per_class_metrics_enabled: true
  sxr_plot_enabled: true
  sxr_plot_num_samples: 100
  spatial_uncertainty_enabled: true
  spatial_uncertainty_num_samples: 10
  spatial_uncertainty_log_every_n_epochs: 1
  attention_enabled: false
  attention_num_samples: 8
  attention_log_every_n_epochs: 1
data:
  aia_dir: /data/FOXES_OG/AIA_processed
  sxr_dir: /data/FOXES_OG/SXR_processed
  sxr_norm_path: /data/FOXES_OG/SXR_processed/normalized_sxr.npy
  aia_norm_path: null
  checkpoints_dir: /data/checkpoints/FOXES-INDEPENDENT-LOCAL-GLOBAL/
  num_workers: 8
wandb:
  entity: ggoodwin5-georgia-state-university
  project: FOXES-SDOML
  job_type: training
  tags:
  - full-data
  - foxes-og
  - embed-512
  - layers-12
  - local-3
  - multiplier-patch-mean
  - weighted-huber
  - detached-patch-uncertainty
  run_name: Independent-Local-Global-Uncertainty
  notes: Independent local multipliers and patch-specific global correction, with detached uncertainty.
