# From the repository root:
# python training/train.py --config training/configs/finetune_patch_global_full_unfrozen.yaml
# Replace checkpoint.initialize_from with the chosen checkpoint from the
# patch-global-replacement run before starting. This starts a NEW optimizer.
base_config: og_correction_power23_lr5e5.yaml

epochs: 25
batch_size: 48
accumulate_grad_batches: 1  # Effective batch 48; leave room for backbone gradients.

uncertainty:
  enabled: true
  start_epoch: 0  # Train the detached uncertainty head as well.
  class_weighting: sqrt_inverse_frequency
  class_weight_exponent: null
  huber_delta: 0.15

vit_architecture:
  learning_rate: 0.00005  # Shared by all unfrozen model parameters.
  global_patch_adjustment: false
  patch_global_context:
    enabled: true
    grid_size: 32
    attention_dim: 128
    num_heads: 4
    max_abs_adjustment: 1.5
    dropout: 0.0

finetune:
  trainable_modules: null  # All model parameters remain trainable.

optimizer:
  weight_decay: 0.00001
  gradient_clip_val: null
  scheduler:
    T_max: 25
    eta_min: 0.0000001

checkpoint:
  initialize_from: /data/checkpoints/FOXES-OG-SQRT-E10-PATCH-GLOBAL-REPLACEMENT/last.ckpt
  resume_from: null
  monitor: val/mse
  mode: min
  save_top_k: -1
  save_last: true
  include_step_in_filename: false
  include_monitor_in_filename: true

early_stopping:
  enabled: false

data:
  checkpoints_dir: /data/checkpoints/FOXES-OG-PATCH-GLOBAL-FULL-UNFROZEN/

wandb:
  run_name: OG-PatchGlobal-FullUnfrozen
  tags: [full-data, foxes-og, finetune, sqrt-weighted-huber, patch-specific-global-attention, full-unfreeze]
  notes: Fresh 25-epoch optimizer from a chosen patch-global-replacement checkpoint. Train backbone, local patch mean, patch-specific global head, and detached uncertainty head with one shared learning rate. Old single-query global correction remains disabled. Select by validation MSE and MAE.
