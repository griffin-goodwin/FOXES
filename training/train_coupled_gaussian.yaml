# Relative file paths use the repository root, independent of the working directory.
path_root: ..

# Architecture/objective preset for model_assets/UncertaintyModel.ckpt:
# 8 local blocks, 8 heads, 3x3 local windows, one shared global query.
# Runtime choices (batch size, seed, hardware, etc.) are editable defaults;
# the checkpoint does not preserve a complete original training recipe.
wavelengths:
- 94
- 131
- 171
- 193
- 211
- 304
- 335
gpu_ids: all
seed: 42
batch_size: 52
accumulate_grad_batches: 1
epochs: 50
model_type: coupled_uncertainty
mean_loss:
  class_weighting: inverse_frequency
  huber_delta: 0.30
  # Optional mean squared signed bias across quiet/C/M/X classes in each batch.
  # Classes present in a batch contribute equally; 0 keeps the original loss.
  bias_penalty_weight: 0.0
uncertainty:
  enabled: true
  initial_relative_std: 1
  max_log10_relative_std: 6
  min_log10_relative_std: -6
  start_epoch: 0
  uncertainty_hidden_dim: 512
vit_architecture:
  dropout: 0.25
  embed_dim: 512
  # Set false to omit the global branch entirely and train only local flux means.
  # The optional uncertainty head still trains; this flag is saved in checkpoints.
  global_patch_adjustment: true
  global_attention_heads: 8
  global_head_hidden_dim: 2048
  global_attention_dropout: 0.25
  hidden_dim: 2048
  learning_rate: 0.0001
  local_window: 3
  mask_mode: local
  max_abs_log10_global_adjustment: 1.5
  num_channels: 7
  num_heads: 8
  num_layers: 8
  num_patches: 4096
  patch_size: 8
optimizer:
  gradient_clip_val: null
  scheduler:
    T_max: 50
    eta_min: 1.0e-06
  weight_decay: 1.0e-05
checkpoint:
  include_monitor_in_filename: true
  include_step_in_filename: false
  mode: min
  monitor: val/total_loss
  save_top_k: -1
  save_last: true
logging:
  log_every_n_steps: 10
callbacks:
  attention_enabled: false
  per_class_metrics_enabled: true
  spatial_uncertainty_enabled: true
  spatial_uncertainty_log_every_n_epochs: 1
  spatial_uncertainty_num_samples: 5
  sxr_plot_enabled: true
  sxr_plot_num_samples: 100
data:
  aia_dir: ./foxes_data/AIA_processed
  aia_norm_path: null
  checkpoints_dir: ./foxes_data/checkpoints/coupled_gaussian/
  num_workers: 8
  sxr_dir: ./foxes_data/SXR_processed
  sxr_norm_path: ./foxes_data/SXR_processed/normalized_sxr.npy
wandb:
  entity: ggoodwin5-georgia-state-university
  job_type: training
  notes: Architecture preset matching model_assets/UncertaintyModel.ckpt with eight
    local 3x3 transformer blocks, eight attention heads, one shared global query,
    inverse-frequency Huber (delta 0.30), and detached Gaussian uncertainty NLL.
  project: FOXES-SDOML
  run_name: Coupled-SingleQuery-Uncertainty
  tags:
  - local-3
  - eight-blocks
  - single-query-global
  - coupled-loss
  - from-scratch
