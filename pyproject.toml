[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helio-foxes"
version = "1.0.7"
description = "FOXES: Framework for Operational X-ray Emission Synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "torch",
  "pytorch-lightning",
  "pandas",
  "python-dateutil",
  "tqdm",
  "PyYAML",
  "matplotlib",
  "drms",
  "astropy>=7.2,<8",
  "sunpy[map,net,timeseries]>=6",
  "h5netcdf",
  "h5py",
  "itipy",
  "aiapy>=0.6.4,<0.11",
]

[project.urls]
Source = "https://github.com/griffin-goodwin/FOXES"
Issues = "https://github.com/griffin-goodwin/FOXES/issues"
Releases = "https://github.com/griffin-goodwin/FOXES/releases"
Demo = "https://huggingface.co/spaces/griffingoodwin04/FOXES-model"
Dataset = "https://huggingface.co/datasets/griffingoodwin04/FOXES-Data"

[project.optional-dependencies]
evaluation = ["scikit-learn", "seaborn", "plotly"]
training = ["wandb", "torchvision"]
dev = [
  "pytest",
  "ipykernel",
  "nbformat",
  "matplotlib==3.10.7",  # Reference renderer for the HARP label-placement tests.
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["helio_foxes", "forecasting", "training", "data", "download"]
