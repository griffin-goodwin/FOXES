[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helio-foxes"
version = "1.0.2"
description = "FOXES: Framework for Operational X-ray Emission Synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "torch",
  "pytorch-lightning",
  "pandas",
  "tqdm",
  "PyYAML",
  "matplotlib",
  "drms",
  "astropy>=7.2,<8",
  "sunpy>=6,<8",
  "h5netcdf",
  "h5py",
  "itipy",
  "aiapy>=0.6.4,<0.11",
]

[project.optional-dependencies]
evaluation = ["scikit-learn", "seaborn", "plotly"]
training = ["wandb", "torchvision"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["helio_foxes", "forecasting", "training", "data", "download"]
