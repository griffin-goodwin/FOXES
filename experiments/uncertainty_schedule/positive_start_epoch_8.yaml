# Positive patch mean with detached independent patch variance starting at epoch 8.
base_config: ../patch_mean_comparison/positive.yaml

uncertainty:
  enabled: true
  start_epoch: 8

callbacks:
  # This combined figure contains attention, patch flux, and patch uncertainty.
  spatial_uncertainty_enabled: false
  attention_enabled: true
  attention_num_samples: 5

checkpoint:
  monitor: val_class/macro_nll
  mode: min

data:
  checkpoints_dir: /data/checkpoints/FOXES-POSITIVE-UNCERTAINTY-START-8/

wandb:
  tags: [uncertainty-schedule, positive-patch-mean, gaussian, independent-patch-variance, start-8]
  run_name: FOXES-POSITIVE-UNCERTAINTY-START-8
  notes: Positive patch mean with detached Gaussian independent patch variance beginning at epoch 8.
