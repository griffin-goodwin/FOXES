# Arm A: detached independent patch variance trains with the mean from epoch 0.
base_config: ../patch_mean_comparison/original.yaml

uncertainty:
  enabled: true
  start_epoch: 0

callbacks:
  # The combined figure contains attention, patch flux, and patch uncertainty.
  # Disable the uncertainty-only figure to avoid logging duplicate maps.
  spatial_uncertainty_enabled: false
  attention_enabled: true
  attention_num_samples: 5

checkpoint:
  monitor: val_class/macro_nll
  mode: min

data:
  checkpoints_dir: /data/checkpoints/FOXES-UNCERTAINTY-START-0/

wandb:
  tags: [uncertainty-schedule, original-patch-mean, gaussian, independent-patch-variance, start-0]
  run_name: FOXES-UNCERTAINTY-START-0
  notes: Original FOXES mean with detached Gaussian independent patch variance trained from epoch 0.
