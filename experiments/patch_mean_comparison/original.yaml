# Arm A: each patch directly predicts normalized log10 SXR.
base_config: ../../training/train_config.yaml

epochs: 15
mean_parameterization: original
uncertainty:
  enabled: false
  start_epoch: null

optimizer:
  scheduler:
    T_max: 15

data:
  aia_dir: /data/FOXES_screening/subset-og-quick/AIA_processed
  sxr_dir: /data/FOXES_screening/subset-og-quick/SXR_processed
  sxr_norm_path: /data/FOXES_screening/subset-og-quick/SXR_processed/normalized_sxr.npy
  # FOXES_OG subset arrays are already scaled to [-1, 1].
  aia_norm_path: null
  checkpoints_dir: /data/checkpoints/FOXES-PATCH-MEAN-ORIGINAL/

wandb:
  tags: [patch-mean-comparison, mean-only, original-patch-mean]
  run_name: FOXES-PATCH-MEAN-ORIGINAL
  notes: Matched mean-only arm using direct normalized-log-SXR patch predictions.
